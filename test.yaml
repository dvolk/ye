kind: ye-command
metadata:
  name: ls
  description: try ls command for manual testing
spec:
  exec:
    command: /usr/bin/ls
    workingDir: /
  args:
    - name: options
      options:
        - '-a'
        - '-ltrh'
    - name: no_options_dir
    - name: one_option_dir
      options:
        - '/'
    - name: multi_options_dir
      options:
        - '/'
        - '/tmp'
        - '/usr'
    - name: variables
      options:
        - '$HOME'
    - name: spaces
      options:
        - '/tmp/dir\ with\ spaces'
    - name: braces
      options:
        - '/etc/{hosts,crontab}'
