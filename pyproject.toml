[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ye"
version = "0.1.0"
description = "ye (yaml execute) runs cli commands based on a YAML config file"
readme = "README.md"
authors = [{name="dvolk"}]
license = {text="GPL3"}
requires-python = ">=3.8"
dependencies = [
    "PyYAML==6.0.2",
    "pyfzf===0.3.1",
    "argh==0.31.3"
]

[project.scripts]
ye = "ye.ye:cli"
